name: Release Pre-release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: true
        default: dev
      tag:
        description: 'Version tag (e.g. v0.1.0-dev)'
        required: true
      title:
        description: 'Release title'
        required: true
      notes:
        description: 'Release notes'
        required: false
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: true
      draft:
        description: 'Is this a draft release?'
        required: false
        default: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set ZIP name
        id: artifact
        run: echo "zip_name=liteDNS-${{ github.event.inputs.tag }}.zip" >> $GITHUB_OUTPUT

      - name: Zip liteDNS module
        working-directory: liteDNS
        run: |
          set -e
          zip -r -9 "../${{ steps.artifact.outputs.zip_name }}" .

      - name: Check ZIP file creation
        run: |
          ZIP_FILE="${{ steps.artifact.outputs.zip_name }}"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Error: ZIP file not created"
            exit 1
          fi
          chmod a+r "$ZIP_FILE"
          echo "ZIP file created."

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.title }}
          body: ${{ github.event.inputs.notes }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: ${{ steps.artifact.outputs.zip_name }}
